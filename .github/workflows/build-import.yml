name: Build clawgod-import

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: clawgod-import-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: clawgod-import-linux-arm64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-26-intel
            artifact: clawgod-import-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: clawgod-import-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: clawgod-import-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup update stable
          rustup target add ${{ matrix.target }}

      - name: Install cross (Linux ARM64)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        working-directory: tools/provider-import
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --locked --release --target ${{ matrix.target }}
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Rename artifact
        shell: bash
        run: |
          src="tools/provider-import/target/${{ matrix.target }}/release/clawgod-import"
          if [ "${{ runner.os }}" = "Windows" ]; then
            src="${src}.exe"
          fi
          cp "$src" "${{ matrix.artifact }}"

      - name: Check native release executable starts
        if: ${{ !matrix.cross }}
        shell: bash
        run: ./"${{ matrix.artifact }}" --help

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
