name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  compat:
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/compat-daily.yml

  build-import:
    uses: ./.github/workflows/build-import.yml

  release:
    needs: [compat, build-import]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download import tools
        uses: actions/download-artifact@v7
        with:
          pattern: clawgod-import-*
          merge-multiple: true
          path: dist

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Resolve versions
        id: versions
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          prev=$(git tag --sort=-version:refname | awk -v tag="$tag" '$0 != tag && !found { print; found=1 }')
          echo "prev=${prev}" >> "$GITHUB_OUTPUT"
          if [ -n "$prev" ]; then
            echo "range=${prev}..${tag}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${tag}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        id: notes
        run: |
          tag="${{ steps.versions.outputs.tag }}"
          prev="${{ steps.versions.outputs.prev }}"
          range="${{ steps.versions.outputs.range }}"
          {
            echo "## Changes"
            echo
            if [ -n "$prev" ]; then
              git log --pretty='- %s (%h)' "$range"
            else
              git log --pretty='- %s (%h)' "$tag"
            fi
            echo
            echo "## Install"
            echo
            echo '**macOS / Linux:**'
            echo '```bash'
            echo "curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash"
            echo '```'
            echo
            echo '**Windows (PowerShell):**'
            echo '```powershell'
            echo "irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex"
            echo '```'
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/${prev}...${tag}"
            fi
          } > release-notes.md

      - name: Prepare and verify final release files
        run: |
          node .github/scripts/release-assets.cjs "$GITHUB_REF_NAME"
          bash -n install.sh

      - name: Check installation from the final release script
        # The lifecycle fixture replaces network/model payloads but keeps the final script structure.
        run: node src/shared/installer-lifecycle.test.mjs install.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.versions.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" install.sh install.ps1 dist/clawgod-import-* --clobber
          else
            gh release create "$tag" install.sh install.ps1 dist/clawgod-import-* \
              --title "ClawGod_Y $tag" \
              --notes-file release-notes.md
          fi
