name: Extended platform compatibility

on:
  schedule:
    - cron: '23 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Default Claude on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-26-intel]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Install ripgrep
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == Linux ]]; then
              sudo apt-get update -qq && sudo apt-get install -y ripgrep
            else
              brew install ripgrep
            fi
          fi
      - name: Install and probe the default version on the native architecture
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("fs").readFileSync("src/templates/install.sh","utf8").match(/^VERSION="([\d.]+)"$/m)[1]')
          bash install.sh "$version"
          [[ "$(cat "$HOME/.clawgod/.source-version")" == "$version" ]]
          [[ "$("$HOME/.clawgod/claude.fallback" --version)" == "$version (Claude Code)" ]]
          "$HOME/.local/bin/clawgod" --version
          node "$HOME/.clawgod/startup-check.cjs" "$(command -v bun)" "$HOME/.clawgod/cli.cjs" --probe-tools

  musl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install and probe on Alpine musl
        shell: bash
        run: |
          docker run --rm -i -v "$GITHUB_WORKSPACE:/workspace" -w /workspace oven/bun:canary-alpine sh <<'SH'
          set -eu
          apk add --no-cache bash nodejs npm ripgrep coreutils
          bash -eu <<'BASH'
          version=$(node -p 'require("fs").readFileSync("src/templates/install.sh","utf8").match(/^VERSION="([\d.]+)"$/m)[1]')
          bash install.sh "$version"
          [[ "$(cat "$HOME/.clawgod/.source-version")" == "$version" ]]
          [[ "$("$HOME/.clawgod/claude.fallback" --version)" == "$version (Claude Code)" ]]
          "$HOME/.local/bin/clawgod" --version
          node "$HOME/.clawgod/startup-check.cjs" "$(command -v bun)" "$HOME/.clawgod/cli.cjs" --probe-tools
          BASH
          SH
